name: Compile Java Sources

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download servlet API
        run: |
          set -e
          mkdir -p lib
          curl -L -o lib/javax.servlet-api-4.0.1.jar https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar

      - name: Compile Java sources
        run: |
          set -e
          find src -name "*.java" > sources.txt || true
          if [ -s sources.txt ]; then
            mkdir -p build/classes
            javac -cp lib/javax.servlet-api-4.0.1.jar -d build/classes @sources.txt
          else
            echo "No Java sources found"
          fi
